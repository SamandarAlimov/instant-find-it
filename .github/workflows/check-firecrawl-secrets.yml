name: Check Firecrawl Secret Availability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-firecrawl-secrets.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence only
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
        shell: bash
        run: |
          if [ -n "$FIRECRAWL_API_KEY" ]; then echo "FIRECRAWL_API_KEY_PRESENT=true"; else echo "FIRECRAWL_API_KEY_PRESENT=false"; fi
          if [ -n "$LOVABLE_API_KEY" ]; then echo "LOVABLE_API_KEY_PRESENT=true"; else echo "LOVABLE_API_KEY_PRESENT=false"; fi
